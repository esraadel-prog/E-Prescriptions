name: Build, Test & Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild and tools
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: msbuild e_prescriptions.sln /t:Restore /p:Configuration=Release

      - name: Build solution (Release Any CPU)
        run: msbuild e_prescriptions.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:m

      - name: Ensure SQLite Interop DLLs exist
        shell: pwsh
        run: |
          $appBin = "src/ePrescriptions.App/bin/Release/net48"
          $testBin = "tests/ePrescriptions.Tests/bin/Release/net48"
          $dirs = @("$appBin/x86", "$appBin/x64", "$testBin/x86", "$testBin/x64")
          foreach ($d in $dirs) {
            if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          }
          $nuget = "$HOME/.nuget/packages/stub.system.data.sqlite.core.netframework"
          $x86Source = Get-ChildItem -Path $nuget -Filter "SQLite.Interop.dll" -Recurse | Where-Object { $_.FullName -like "*x86*" } | Select-Object -First 1
          $x64Source = Get-ChildItem -Path $nuget -Filter "SQLite.Interop.dll" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($x86Source) {
            Copy-Item $x86Source.FullName "$appBin/x86/SQLite.Interop.dll" -Force
            Copy-Item $x86Source.FullName "$testBin/x86/SQLite.Interop.dll" -Force
          }
          if ($x64Source) {
            Copy-Item $x64Source.FullName "$appBin/x64/SQLite.Interop.dll" -Force
            Copy-Item $x64Source.FullName "$testBin/x64/SQLite.Interop.dll" -Force
          }
          if (-not (Test-Path "$appBin/x86/SQLite.Interop.dll") -or -not (Test-Path "$appBin/x64/SQLite.Interop.dll")) {
            throw "SQLite.Interop.dll files could not be located in output or NuGet cache."
          }

      - name: Run unit tests
        run: dotnet test tests/ePrescriptions.Tests/ePrescriptions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Verify test results
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path tests/ePrescriptions.Tests/TestResults -Filter *.trx -Recurse
          if (-not $trxFiles) { throw "No test result trx file found." }
          [xml]$trx = Get-Content $trxFiles[0].FullName
          $Counters = $trx.TestRun.ResultSummary.Counters
          Write-Host "Test Counters: executed=$($Counters.executed), passed=$($Counters.passed), failed=$($Counters.failed), errors=$($Counters.error)"
          if ([int]$Counters.executed -eq 0) { throw "Zero tests executed. Test discovery failed." }
          if ([int]$Counters.failed -gt 0) { throw "Tests failed: $($Counters.failed) failures detected." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/ePrescriptions.Tests/TestResults/*.trx

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/e_prescriptions_installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ePrescriptions-Installer
          path: dist/installer/*

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: ePrescriptions-Binaries
          path: src/ePrescriptions.App/bin/Release/net48/*
